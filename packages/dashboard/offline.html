    <!--
      The offline page (spec 04 §18.6): served from the service worker's cache when BrowserHive does
      not answer, without a CSP nonce, so it has no inline script. This style block (allowed by the
      CSP's style-src 'unsafe-inline') makes even the first frame dark under a dark OS setting;
      src/offline/main.ts then applies the operator's theme choice. Colours = the background token.
    -->
    <style>
      html {
        background: oklch(0.985 0.002 250);
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: oklch(0.155 0.004 250);
          color-scheme: dark;
        }
      }
    </style>

    <noscript>

  </body>
