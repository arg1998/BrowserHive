name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which jobs a change needs, so a website-only PR does not run the library pipeline.
  # Jobs skipped through `if` report success and keep the required checks satisfied; a
  # workflow-level `paths` filter would leave them pending forever instead.
  #   code: something outside website/, docs/ and root Markdown changed → everything runs
  #   docs: docs/ or root Markdown changed → the generated-docs and link gates run
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; running everything."
            { echo "code=true"; echo "docs=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          printf 'Changed files:\n%s\n' "$changed"
          light='^(website/|\.github/workflows/website\.yml$|docs/|[A-Z]+\.md$)'
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE "$light"; then code=true; else code=false; fi
          if printf '%s\n' "$changed" | grep -qE '^(docs/|[A-Z]+\.md$)'; then docs=true; else docs=false; fi
          { echo "code=$code"; echo "docs=$docs"; } >> "$GITHUB_OUTPUT"
          echo "code=$code docs=$docs"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test test/lint packages/core/test/lint
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  depcruise:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run depcruise

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run test:server -- --coverage --coverage-reporter=lcov
      - run: bun run test:dashboard
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        if: env.CODECOV_TOKEN != ''
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  goldens:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run test:goldens
      - run: bun run gen:openapi --check
      - run: bun run gen:docs --check
      - run: bun run gen:db-types --check
      # Docs link and spelling gates; also part of `unit`, repeated here for docs-only changes.
      - run: bun test test/docs

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cd packages/browserhive && bun pm pack --destination ../../dist-pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserhive-dist
          path: packages/browserhive/dist
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserhive-tarball
          path: dist-pack/*.tgz
          retention-days: 7

  integration:
    # Windows is not yet supported end to end (issue #2); it runs for
    # visibility but does not fail the workflow.
    # Gated per step rather than per job: a matrix job skipped through a job-level `if` reports as
    # `integration` instead of `integration (ubuntu-latest)`, which would leave that required check
    # pending.
    needs: changes
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN != 'true'
        run: echo "No library changes; integration tests not needed."
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - if: env.RUN == 'true'
        run: bun install --frozen-lockfile
      - if: env.RUN == 'true'
        id: pw
        shell: bash
        run: echo "version=$(bun -e "console.log(require('playwright-core/package.json').version)")" >> "$GITHUB_OUTPUT"
      - if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: env.RUN == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps
      - if: env.RUN == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then printf 'BROWSERHIVE_DATA_DIR=%s\\bh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"; fi
      - if: env.RUN == 'true'
        run: bun run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browserhive-dist
          path: packages/browserhive/dist
      - run: bunx playwright install chromium --with-deps
      # A real daemon from the built package, on a throwaway data dir. The E2E variables are set only
      # for Playwright: the CLI rejects unknown BROWSERHIVE_* variables in its own environment.
      - name: Start daemon
        run: |
          data="$RUNNER_TEMP/bh-e2e"
          nohup bun packages/browserhive/dist/bin.js --admin --port 9876 --dataDir "$data" > "$RUNNER_TEMP/daemon.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9876/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9876/health > /dev/null || { cat "$RUNNER_TEMP/daemon.log"; exit 1; }
          echo "E2E_PASSWORD=$(tr -d '\n' < "$data/admin/credentials.txt")" >> "$GITHUB_ENV"
      - name: Seed the journey's data
        run: bun scripts/e2e-seed.ts http://127.0.0.1:9876
      - name: Playwright
        run: BROWSERHIVE_E2E_URL=http://127.0.0.1:9876 BROWSERHIVE_E2E_PASSWORD="$E2E_PASSWORD" bun run test:e2e
      - if: failure()
        run: cat "$RUNNER_TEMP/daemon.log" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-traces
          path: packages/dashboard/test-results
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browserhive-dist
          path: packages/browserhive/dist
      - run: bun run package:check

  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run license:check

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level high

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            contracts
            core
            dashboard
            cli
            sessions
            browsers
            stealth
            tools
            http
            ws
            auth
            vault
            attention
            persistence
            observability
            config
            blocklist
            notifications
            docs
            ci
            deps
            release
            security
            website
          requireScope: false

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun scripts/changeset-status.ts
        env:
          PR_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}"
