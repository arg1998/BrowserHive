name: release

on:
  push:
    branches: [main]

concurrency: release-main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # `changeset publish` runs `npm publish`. npm >= 11.5 publishes through OIDC trusted publishing
      # (with provenance), so no NPM_TOKEN exists. Node 24 ships npm 11; no registry-url, because the
      # .npmrc it writes expects a token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --version
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run release:version
          publish-script: bun run release:publish
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # The action pushes the `browserhive@x.y.z` tag and creates the GitHub Release from the changelog.
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Attach the package tarball to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "browserhive") | .version')
          cd packages/browserhive && bun pm pack --destination ../../dist-pack && cd ../..
          gh release upload "browserhive@$version" dist-pack/*.tgz
