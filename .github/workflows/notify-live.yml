name: notify-live

# Live notification check (spec 09 §8): real Telegram (a Rich Message with act buttons), a Discord
# webhook, a Discord bot (gateway and interactive buttons) and ntfy (with a reply-topic round
# trip), through the real adapters: send with a screenshot, read back where the platform allows,
# edit, delete. It
# guards against the fakes drifting from the platforms. Runs weekly, on dispatch, and on pull
# requests labelled `live-notify` from this repository (never from forks). The `notify-live`
# environment holds the secrets and needs the owner's approval. A platform whose secrets are not
# set is skipped with a note. A failure opens (or comments on) an issue.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: notify-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'live-notify') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: notify-live
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: 'bun-${{ runner.os }}-${{ hashFiles(''bun.lock'') }}'
      - run: bun install --frozen-lockfile
      - name: Send, read back, edit and delete on each platform
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bun scripts/notify-live.ts
      - name: Open or update the drift issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly live notification check failed"
          body="The live notification check against the real platforms failed.

          - Run: $RUN_URL

          A platform's API may have changed, or a secret in the notify-live environment expired. The fakes in packages/core/test/helpers/fake-platforms.ts may have drifted from the real platforms; see the job summary for which platform failed."
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
