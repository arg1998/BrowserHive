name: Feature request
description: Propose a capability
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes: { label: Tier, options: [zero-config, opt-in, plugin] }
  - type: textarea
    id: contracts
    attributes: { label: Affected contracts, description: "tools, routes, WS messages, config keys, DB" }
